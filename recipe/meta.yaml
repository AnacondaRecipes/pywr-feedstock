{% set name = "pywr" %}
{% set version = "1.29.0" %}
{% set sha256 = "a00bd7efca319bbb715121c2b110446af34802ae4ac9707701ff4f35248e9bb7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    # [build-system].requires per upstream pyproject.toml
    - setuptools
    - setuptools-scm >=8
    - cython >=3
    - numpy {{ numpy }}
    # Linked solver libraries (setup.py: libraries=["glpk"] / ["lpsolve55"])
    - glpk {{ glpk }}
    - lp_solve 5.5.2.11
  run:
    - python
    # 1.29.0 predates upstream's pandas<3 cap (added in 1.30.0); pkgs/main ships pandas 3.x
    - pandas <3
    - networkx
    - numpy
    - scipy
    - pytables
    - openpyxl
    - packaging

test:
  files:
    - run_test.py
  imports:
    - pywr
    - pywr.core
  requires:
    - pip
  commands:
    - pip check
    # run_test.py solves a tiny LP with both solver backends and exercises
    # TablesRecorder write/read (PyTables I/O)
    - python run_test.py

about:
  home: https://github.com/pywr/pywr
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: Pywr is a generalised network resource allocation model written in Python
  description: |
    Pywr is a tool for solving network resource allocation problems at
    discrete timesteps using a linear programming approach. It's principal
    application is in resource allocation in water supply networks, although
    other uses are conceivable. It uses Cython extensions for computational
    efficiency.
  doc_url: https://pywr.github.io/pywr
  dev_url: https://github.com/pywr/pywr

extra:
  recipe-maintainers:
    - jetuk
