{% set name = "pywr" %}
{% set version = "1.31.1" %}
{% set sha256 = "b23f6c611a47dce0c4a8c9b932e419d82cbb3c0cb022273613c552f7e74f3816" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    # [build-system].requires per upstream pyproject.toml
    - setuptools
    - setuptools-scm >=8
    - cython >=3
    - numpy {{ numpy }}
    # Linked solver libraries (setup.py: libraries=["glpk"] / ["lpsolve55"])
    - glpk {{ glpk }}
    - lp_solve 5.5.2.11
  run:
    - python
    - pandas <3
    - networkx
    - numpy
    - scipy
    - pytables
    - openpyxl
    - packaging

test:
  imports:
    - pywr
    - pywr.core
  requires:
    - pip
  commands:
    - pip check
    # Verify the linked solver extensions load (solver imports in pywr.solvers are try/except-guarded, so a bare import would pass with broken linkage)
    - python -c "from pywr.solvers import cython_glpk, cython_lpsolve"

about:
  home: https://github.com/pywr/pywr
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: Pywr is a generalised network resource allocation model written in Python
  description: |
    Pywr is a tool for solving network resource allocation problems at
    discrete timesteps using a linear programming approach. It's principal
    application is in resource allocation in water supply networks, although
    other uses are conceivable. It uses Cython extensions for computational
    efficiency.
  doc_url: https://pywr.github.io/pywr/
  dev_url: https://github.com/pywr/pywr

extra:
  recipe-maintainers:
    - jetuk
